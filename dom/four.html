<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aditya Codes</title>
</head>

<body style="background-color: aqua;">

    <ul class="language">
        <li>Aditya</li>
    </ul>

    <script>
        function addLanguage(lanName) {
            const li = document.createElement('li');
            li.innerHTML = `${lanName}`;

            document.querySelector('.language').appendChild(li);
        }

        addLanguage("JavaScript");
        addLanguage("Python");
        addLanguage("C++");
        function addoptiLangauage(langName){
            const li= document.createElement('li');
            li.appendChild(document.createTextNode(langName))
            document.querySelector('.language').appendChild(li);
        }
        addoptiLangauage("Jss");
        //edit
        const secondli=document.querySelector("li:nth-child(2)")
        console.log(secondli)
        const newli=document.createElement("li")
        newli.textContent="react"
        secondli.replaceWith(newli);
        //edit
        const firstli=document.querySelector("li:first-child")
        firstli.outerHTML="<li>jsss</li>"
        //remove
        const lastli=document.querySelector("li:last-child")
        lastli.remove();
    </script>


</body>
</html>
