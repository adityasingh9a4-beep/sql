<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        form {
            width: 350px;
            margin: auto;
            padding: 30px;
            border: 2px solid black;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #results {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>BMI Calculator</h1>

    <form>

        <label>Height in cm:</label>
        <input type="text" id="height">

        <br>

        <label>Weight in kg:</label>
        <input type="text" id="weight">

        <br>

        <button type="submit">Calculate</button>

        <div id="results"></div>

    </form>

    <script src="bmi.js"></script>

</body>

</html>
